# Runs the same checks as scripts/check.py on every pull request and on main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18.1
        env:
          POSTGRES_USER: simb
          POSTGRES_PASSWORD: simb_ci
          POSTGRES_DB: simb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U simb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-only-not-secret
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost
      DATABASE_URL: postgres://simb:simb_ci@localhost:5432/simb

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements/dev.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run all checks
        run: backend/.venv/bin/python scripts/check.py
